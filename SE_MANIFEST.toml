# ============================================================
# SE_MANIFEST.toml (Repository Intent, Scope, and Role)
# ============================================================

schema = "se-manifest-1"
schema_url = "https://github.com/structural-explainability/spec-se/blob/main/manifests/se-manifest-1.md"

[meta]
# Non-normative contextual information
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
framework_note = "Provides definitions and conventions for SE_MANIFEST semantics."
description = "Declarative claim of repository intent, scope, and role."
purpose = "To make explicit the boundaries, responsibilities, and expectations of this repository relative to others."

[repo]
name = "se100_the_ontological_neutrality_theorem"
org  = "structural-explainability"
kind = "paper"
status = "under-review"
since = "2025"
summary = "Applied ontology paper establishing structural constraints for neutral substrates under persistent interpretive disagreement."

[layer]
space = "SE"
role  = "justification-neutrality"

[depends]
required = []
optional = []

[provides]
artifacts = [
    "ANNOTATIONS.md",
    "CITATION.cff",
    "LICENSE",
    "README.md",
    "SE_MANIFEST.toml",
    "paper/*.tex",
    "glossary/*.tex"
]

[scope]
includes = [
  "formal requirements for ontological neutrality",
  "necessary and sufficient conditions for neutral substrate design",
  "structural constraint on causal and normative commitments at the foundational layer",
  "illustrative example of interpretive disagreement in incident investigation",
  "glossary of key terms",
]
excludes = [
  "normative specification text",
  "implementation requirements",
  "domain ontology design",
]

[citation]
cff = "CITATION.cff"
preferred = "paper"
bib_hint = "case2025neutrality"

[traceability]
identifier_map = "none"
