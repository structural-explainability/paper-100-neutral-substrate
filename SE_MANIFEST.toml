# ============================================================
# SE_MANIFEST.toml (Repository Intent, Scope, and Role)
# ============================================================

schema = "se-manifest-1"
schema_url = "https://github.com/structural-explainability/spec-se/blob/main/manifests/se-manifest-1.md"

[meta]
# Non-normative contextual information
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
framework_note = "Provides definitions and conventions for SE_MANIFEST semantics."
description = "Declarative claim of repository intent, scope, and role."
purpose = "To make explicit the boundaries, responsibilities, and expectations of this repository relative to others."

[repo]
name = "paper-100-neutral-substrate"
org  = "structural-explainability"
kind = "paper"
status = "under-review"
since = "2026"
summary = "Applied ontology paper establishing the Ontological Neutrality Theorem and characterizing neutrality as interpretive non-commitment with extension stability under persistent disagreement."

[layer]
space = "SE"
role  = "justification-neutrality"

[result]
type = "theorem"
name = "Ontological Neutrality Theorem"
object = "neutral ontological substrates"

[depends]
required = []
optional = []

[provides]
artifacts = [
    "ANNOTATIONS.md",
    "CITATION.cff",
    "LICENSE",
    "README.md",
    "SE_MANIFEST.toml",
    "paper/*.tex",
    "glossary/*.tex"
]

[scope]
includes = [
  "formal definition of ontological neutrality",
  "interpretive non-commitment at the substrate layer",
  "extension stability under incompatible interpretations",
  "structural constraint excluding causal and normative commitments at the substrate layer",
  "illustrative example of persistent interpretive disagreement",
  "glossary of key terms"
]
excludes = [
  "identity-regime derivations",
  "normative specification text",
  "implementation requirements",
  "domain ontology design"
]

[citation]
cff = "CITATION.cff"
preferred = "paper"
bib_hint = "case2026neutrality"

[traceability]
identifier_map = "none"
