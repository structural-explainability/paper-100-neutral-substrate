# WHY: Automatically builds LaTeX PDF when the paper changes
# ALT: Manual trigger available via workflow_dispatch

name: Build LaTeX PDF

on:
  push:
    branches: [main]
    paths:
      - "*.tex"
      - ".github/workflows/build-latex.yml"
      - ".github/tl_packages"

  pull_request:
    branches: [main]
    paths:
      - "*.tex"
      - ".github/workflows/build-latex.yml"
      - ".github/tl_packages"

  workflow_dispatch:

permissions:
  contents: read # WHY: Required to checkout repository files for link inspection.

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # ASSEMBLE: Get code and set up environment
      # ============================================================

      - name: A1) Checkout repository code
        # WHY: Needed to access files for checks.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # WHY: Install TeX Live in CI in a maintainable way.
        # OBS: This action installs tlmgr and packages listed in .github/tl_packages.
        with:
          persist-credentials: false
          # WHY: Make repository files available so their links can be inspected.

      # WHY: Install TeX Live in CI in a maintainable way
      # OBS: This action installs tlmgr, but does not install TeX packages unless specified
      - name: A2) Setup TeX Live
        uses: TeX-Live/setup-texlive-action@eb78d21f41941476d9121e3a0abcab73265c876f # v4
        with:
          # WHY: At minimum, install a scheme so pdflatex/latexmk exist
          # OBS: scheme-basic is the recommended minimum in the action docs
          # ALT: Use scheme-medium if you want fewer missing .sty surprises
          package-file: .github/tl_packages
          cache: true

      - name: A3) Confirm TeX binaries available
        run: |
          set -e
          which pdflatex
          pdflatex --version
          which latexmk
          latexmk --version
          kpsewhich authblk.sty

      # ============================================================
      # VALIDATE: Build PDF only
      # ============================================================

      # WHY: Validate LaTeX compiles without errors so it is ready for arXiv prep.
      # OBS: PDF is built in artifacts/ and not committed.
      - name: D1) Build PDF to validate LaTeX
        run: |
          set -e
          rm -rf artifacts
          mkdir -p artifacts
          latexmk -g -pdf -interaction=nonstopmode -halt-on-error \
            -auxdir=artifacts -outdir=artifacts \
            se100-neutral-substrates.tex
          test -f artifacts/se100-neutral-substrates.pdf
